<div class="auth-container">
  <div class="auth-card">
    
    <div class="brand-header">
      <img src="logo.svg" alt="App Logo" class="app-logo">
      <h2>New Password</h2>
      <p class="subtitle">Set a new password for your account.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
      
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="input-wrapper">
          <img src="lock.svg" class="input-icon" alt="lock icon">
          
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
            minlength="6"
            [(ngModel)]="password"
          >
          
          <button type="button" class="toggle-pass" (click)="togglePassword()">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <button type="button" class="btn-primary" 
              (click)="onSubmit()"
              [disabled]="!resetForm.form.valid || isLoading">
        {{ isLoading ? 'Updating...' : 'Reset Password' }}
      </button>

    </form>
    
    <div class="auth-footer">
      <a routerLink="/login" class="back-link">Cancel</a>
    </div>

  </div>
</div>
